# Monsters, Inc. Scare Island (PAL / English) — SCES-03759.
#
# This is a pre-filled baseline. Running scripts/build_from_disc.sh (or
# psxrecomp/tools/new_project_layout/probe_disc.py --write-game-toml) against
# your own legal dump overwrites it with the exact EXE header, Track 01
# digests and TOC fingerprint read from the disc.
#
# Header fields (load_address / entry_pc / text_size / stack_base) are left
# out on purpose: psxrecomp-game reads them from the PS-X EXE header itself.
# See psxrecomp/docs/GAME_PROJECT_SETUP.md and psxrecomp/docs/config_schema.md.

[game]
name = "Monsters, Inc. Scare Island"
id = "SCES-03759"
players = 1
exe = "disc/SCES_037.59"
disc = "disc/Monsters, Inc. - Scare Island (Europe).cue"

[prepare_disc]
out_dir = "disc"
boot_exe = "SCES_037.59"

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "Monsters, Inc. Scare Island Recompiled"
memcard_dir = "saves"

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"
